name: HA App Build

# Reusable workflow – call via hasos-app.yaml.yml

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      checkout_ref:
        required: false
        default: ""
        type: string
      defer_image_size_commit:
        required: false
        default: false
        type: boolean

jobs:

  prepare:
    name: Prepare
    if: github.repository == 'sandmaennchen5/ha-repo'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      upstream_version: ${{ steps.upstream.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Get upstream version
        id: upstream
        env:
          APP_PATH: ${{ inputs.app }}
        shell: bash
        run: |
          upstream_version="$(
            awk -F: '
              $1 == "upstream_version" {
                value = substr($0, index($0, ":") + 1)
                gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                print value
                exit
              }
            ' "${APP_PATH}/.var.yaml"
          )"
          if [[ -z "${upstream_version}" ]]; then
            echo "::error::.var.yaml does not define upstream_version"
            exit 1
          fi
          echo "version=${upstream_version}" >> "$GITHUB_OUTPUT"

      - name: Normalize app information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          name=${{ steps.info.outputs.name }}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          description=${{ steps.info.outputs.description }}
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          url=${{ steps.info.outputs.url }}
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Resolve app build arguments
        id: build_args
        shell: bash
        env:
          APP_PATH: ${{ inputs.app }}
          BUILD_ARCH: ${{ matrix.arch }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
        run: |
          read_var() {
            awk -F: -v key="$1" '
              $1 == key {
                value = substr($0, index($0, ":") + 1)
                gsub(/^[[:space:]\"]+|[[:space:]\"]+$/, "", value)
                print value
                exit
              }
            ' "${APP_PATH}/.var.yaml"
          }

          {
            echo 'values<<EOF'
            echo "UPSTREAM_VERSION=${UPSTREAM_VERSION}"

            case "${APP_PATH#apps/}" in
              portainer)
                echo "PORTAINER_CE_LTS_IMAGE=portainer/portainer-ce:$(read_var lts_version)-alpine"
                echo "PORTAINER_CE_STS_IMAGE=portainer/portainer-ce:$(read_var sts_version)-alpine"
                echo "PORTAINER_EE_LTS_IMAGE=portainer/portainer-ee:$(read_var secondary_lts_version)-alpine"
                echo "PORTAINER_EE_STS_IMAGE=portainer/portainer-ee:$(read_var secondary_sts_version)-alpine"
                ;;
              portainer-agent)
                echo "AGENT_LTS_IMAGE=portainer/agent:$(read_var lts_version)-alpine"
                echo "AGENT_STS_IMAGE=portainer/agent:$(read_var sts_version)-alpine"
                ;;
            esac

            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          build-args: ${{ steps.build_args.outputs.values }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

      - name: Collect compressed image size
        if: inputs.defer_image_size_commit
        env:
          APP_PATH: ${{ inputs.app }}
        run: |
          app_slug="${APP_PATH#apps/}"
          python .github/scripts/update_image_size.py \
            --image "${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}" \
            --app "${app_slug}" \
            --result-file "image-size-result/${app_slug}.json"

      - name: Update compressed image size
        if: ${{ ! inputs.defer_image_size_commit }}
        run: |
          python .github/scripts/update_image_size.py \
            --image "${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}" \
            --var-file "${{ inputs.app }}/.var.yaml"

      - name: Upload image size result
        if: inputs.defer_image_size_commit
        uses: actions/upload-artifact@v7
        with:
          name: image-size-${{ needs.prepare.outputs.image_name }}
          path: image-size-result/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit image size
        if: ${{ ! inputs.defer_image_size_commit }}
        env:
          APP_PATH: ${{ inputs.app }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- "$APP_PATH/.var.yaml"; then
            echo "Image size is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_PATH/.var.yaml"
          git commit -m "chore: update image size for ${APP_PATH#apps/}"

          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Unable to push the updated image size after three attempts."
            exit 1
          fi

          # Pushes made with GITHUB_TOKEN do not start another workflow.
          gh workflow run update_readme.yaml --ref "$GITHUB_REF_NAME"
