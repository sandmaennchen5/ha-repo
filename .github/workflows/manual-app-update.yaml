name: Manually App Update

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App slug"
        required: true
        type: string
      version:
        description: "New semantic version, for example 1.2.3"
        required: true
        type: string
      updated:
        description: "Update date in YYYY-MM-DD format"
        required: true
        type: string
      upstream_commit:
        description: "Optional commit SHA or image digest; empty keeps current value"
        required: false
        default: ""
        type: string
      source:
        description: "Optional source; empty keeps current value"
        required: false
        default: ""
        type: string
      release_notes:
        description: "Release notes for CHANGELOG.md"
        required: false
        default: "Manuell aktualisierte Version."
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: manual-app-update-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ inputs.app }} to ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install updater dependencies
        run: python -m pip install -r .github/requirements.txt

      - name: Apply supplied metadata
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPDATED: ${{ inputs.updated }}
          INPUT_COMMIT: ${{ inputs.upstream_commit }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          python .github/scripts/manual_update_app.py \
            --app "$INPUT_APP" \
            --version "$INPUT_VERSION" \
            --updated "$INPUT_UPDATED" \
            --commit "$INPUT_COMMIT" \
            --source "$INPUT_SOURCE" \
            --notes "$INPUT_NOTES"

      - name: Validate changed YAML
        env:
          INPUT_APP: ${{ inputs.app }}
        run: |
          python - "$INPUT_APP" <<'PY'
          from pathlib import Path
          import sys
          import yaml

          app = Path("apps") / sys.argv[1]
          yaml.safe_load((app / "config.yaml").read_text(encoding="utf-8"))
          yaml.safe_load((app / ".var.yaml").read_text(encoding="utf-8"))
          print(f"YAML valid for {app.name}.")
          PY

      - name: Commit and push manual update
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "apps/$INPUT_APP"
          if git diff --cached --quiet; then
            echo "No app metadata changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore($INPUT_APP): update to $INPUT_VERSION"
          git push
          echo "Updated \`$INPUT_APP\` to \`$INPUT_VERSION\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish updated app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APP: ${{ inputs.app }}
        run: |
          gh workflow run hasos-app.yaml \
            --ref "$GITHUB_REF_NAME" \
            -f app_custom="$INPUT_APP" \
            -f publish=true
          echo "App Builder started for \`$INPUT_APP\`." >> "$GITHUB_STEP_SUMMARY"
