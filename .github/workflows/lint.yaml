name: Check Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🔍 Find app directories
        id: addons
        shell: bash
        run: |
          mapfile -t addons < <(
            find apps -mindepth 2 -maxdepth 2 -type f \
              \( -name config.json -o -name config.yaml -o -name config.yml \) \
              -printf '%h\n' |
            sort -u
          )

          if [ "${#addons[@]}" -eq 0 ]; then
            echo "::error::No app configurations found below apps/."
            exit 1
          fi

          addons_list=$(jq -cn --args '$ARGS.positional' "${addons[@]}")
          echo "Found apps: ${addons[*]}"
          echo "addons_list=$addons_list" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"
