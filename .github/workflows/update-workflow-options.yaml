name: Update Manual Applist

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Update app list
        shell: python
        run: |
          from pathlib import Path

          workflow_file = Path(".github/workflows/hasos-app.yaml")
          apps_directory = Path("apps")

          begin_marker = "          # BEGIN_APPS"
          end_marker = "          # END_APPS"

          content = workflow_file.read_text(encoding="utf-8")

          apps = sorted(
              directory.name
              for directory in apps_directory.iterdir()
              if directory.is_dir() and not directory.name.startswith(".")
          )

          generated_options = "\n".join(
              f"          - {app}"
              for app in apps
          )

          before, remainder = content.split(begin_marker, 1)
          _, after = remainder.split(end_marker, 1)

          updated_content = (
              before
              + begin_marker
              + "\n"
              + generated_options
              + "\n"
              + end_marker
              + after
          )

          workflow_file.write_text(updated_content, encoding="utf-8")

      - name: Commit updated list
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/hasos-app.yaml; then
            echo "Die App-Liste ist bereits aktuell."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/hasos-app.yaml
          git commit -m "chore: update manual app list"
          git push origin HEAD:main
