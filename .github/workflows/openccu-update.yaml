name: OpenCCU Update

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: openccu-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'sandmaennchen5/ha-repo'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install -r .github/requirements.txt
      - name: Test overlay and updater
        run: |
          python -m unittest discover -s .github/tests -p 'test_openccu*.py'
          node --test .github/tests/openccu-proxy.test.cjs
      - name: Stage original updates with fixed login patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sync_openccu.py
      - name: Validate generated apps
        run: python .github/scripts/schema_validator.py
      - name: Plan changed images
        id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, yaml
          from pathlib import Path
          names = subprocess.check_output(['git', 'diff', '--name-only', '--', 'apps'], text=True).splitlines()
          slugs = sorted({p.split('/')[1] for p in names if p.endswith('/config.yaml') and p.split('/')[1].startswith('openccu')})
          entries = []
          for slug in slugs:
              config = yaml.safe_load(Path('apps', slug, 'config.yaml').read_text())
              entries.append({'app': slug, 'image': config['image'], 'version': config['version']})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps(entries) + '\n')
              f.write('sha=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n')
          PY
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.matrix != '[]'
        with:
          name: openccu-candidates
          include-hidden-files: true
          path: |
            apps/openccu/
            apps/openccu-dev/
            apps/openccu-proxy/
            apps/openccu-hapdrap/

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: openccu-candidates
          path: apps
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable version (not latest)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ matrix.version }}
          labels: |
            io.hass.type=addon
            io.hass.version=${{ matrix.version }}
            org.opencontainers.image.source=https://github.com/sandmaennchen5/ha-repo
      - name: Smoke-test runtime without CCU services or hardware
        env:
          APP: ${{ matrix.app }}
          IMAGE: ${{ matrix.image }}:${{ matrix.version }}
        run: |
          case "$APP" in
            openccu|openccu-dev)
              docker run --rm -i --network none --entrypoint node "$IMAGE" - /bin/ha-proxy.js < .github/tests/openccu-container-smoke.cjs
              ;;
            openccu-proxy)
              docker run --rm -i --network none --entrypoint node "$IMAGE" - /app/ha-proxy.js.gtpl < .github/tests/openccu-container-smoke.cjs
              ;;
            openccu-hapdrap)
              docker run --rm --network none --entrypoint /bin/bash "$IMAGE" -n /app/entrypoint.sh
              ;;
          esac

  advertise:
    needs: [prepare, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Refuse to overwrite concurrent repository changes
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$PREPARED_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: openccu-candidates
          path: apps
      - name: Advertise versions only after all images passed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/openccu apps/openccu-dev apps/openccu-proxy apps/openccu-hapdrap
          git diff --cached --quiet && exit 0
          git commit -m "chore: update OpenCCU originals with checked login overlay"
          git push origin "HEAD:${{ github.ref_name }}"
