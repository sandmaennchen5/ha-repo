name: Update Apps

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "App slug; leave empty to update all supported apps"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: update-app-versions
  cancel-in-progress: false

jobs:
  update:
    name: Update apps
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install updater dependencies
        run: python -m pip install -r .github/requirements.txt

      - name: Discover and update apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/update_apps.py
          --app "${{ inputs.app }}"
          ${{ github.event_name == 'schedule' && '--scheduled' || '' }}

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("apps").glob("*/config.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          for path in Path("apps").glob("*/.var.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print("All app YAML files are valid.")
          PY

      - name: Commit and push updates
        id: commit
        run: |
          if git diff --quiet -- apps; then
            echo "No app updates available." >> "$GITHUB_STEP_SUMMARY"
            echo "changed_apps=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_apps=$(
            git diff --name-only -- apps |
            awk -F/ '$1 == "apps" && $3 == "config.yaml" { print $2 }' |
            sort -u |
            jq -R . |
            jq -sc .
          )
          echo "changed_apps=$changed_apps" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "chore: update upstream app versions"
          git push

      - name: Build and publish updated apps
        if: steps.commit.outputs.changed_apps != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_APPS: ${{ steps.commit.outputs.changed_apps }}
        run: |
          while IFS= read -r app; do
            echo "Starting App Builder for $app" >> "$GITHUB_STEP_SUMMARY"
            gh workflow run hasos-app.yaml \
              --ref "$GITHUB_REF_NAME" \
              -f app_custom="$app" \
              -f publish=true
          done < <(jq -r '.[]' <<< "$CHANGED_APPS")
