name: Update Apps

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Versionsprüfung für alle Apps oder eine ausgewählte App"
        required: true
        default: all
        type: choice
        options:
          - all
          # BEGIN_APPS
          - adsb-multi-portal-feeder
          - checkmk-agent
          - dockhand
          - drydock
          - homey-shs
          - newt
          - olm
          - openccu
          - openccu-dev
          - openccu-hapdrap
          - openccu-proxy
          - pangolin-cli
          - portainer
          - portainer-agent
          - portainer-agent-lts
          - portainer-agent-sts
          - portainer-ce-lts
          - portainer-ce-sts
          - portainer-ee-lts
          - portainer-ee-sts
          # END_APPS
      rebuild_all:
        description: "Alle Apps nach der Versionsprüfung neu bauen und veröffentlichen"
        required: false
        default: false
        type: boolean
      bump_app_revision:
        description: "App-Version vor dem Build um eine Revision erhöhen (N+1)"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: update-app-versions
  cancel-in-progress: false

jobs:
  update:
    name: Update apps
    runs-on: ubuntu-latest
    outputs:
      build_apps: ${{ steps.build_plan.outputs.build_apps }}
      checkout_ref: ${{ steps.build_plan.outputs.checkout_ref }}
      failed_apps: ${{ steps.discover.outputs.failed_apps }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install updater dependencies
        run: python -m pip install -r .github/requirements.txt

      - name: Test updater error handling
        run: python .github/tests/test_update_apps_failures.py

      - name: Discover and update apps
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_APP: ${{ inputs.app }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          BUMP_APP_REVISION: ${{ inputs.bump_app_revision }}
        shell: bash
        run: |
          args=(--continue-on-error)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${SELECTED_APP}" != "all" ]]; then
            args+=(--app "${SELECTED_APP}")
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--scheduled)
          fi
          if [[ "${BUMP_APP_REVISION}" == "true" ]]; then
            args+=(--bump-revision)
          fi
          python .github/scripts/update_apps.py "${args[@]}"

      - name: Validate YAML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path("apps").glob("*/config.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          for path in Path("apps").glob("*/.var.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print("All app YAML files are valid.")
          PY

      - name: Commit and push updates
        id: commit
        run: |
          if git diff --quiet -- apps; then
            echo "No app updates available." >> "$GITHUB_STEP_SUMMARY"
            echo "changed_apps=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_apps=$(
            git diff --name-only -- apps |
            awk -F/ '$1 == "apps" && $3 == "config.yaml" { print $2 }' |
            sort -u |
            jq -R . |
            jq -sc .
          )
          echo "changed_apps=$changed_apps" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "chore: update upstream app versions"
          git push

      - name: Prepare build matrix
        id: build_plan
        env:
          CHANGED_APPS: ${{ steps.commit.outputs.changed_apps }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          FAILED_APPS: ${{ steps.discover.outputs.failed_apps }}
        run: |
          if [[ "${REBUILD_ALL}" == "true" ]]; then
            CHANGED_APPS=$(
              find apps -mindepth 1 -maxdepth 1 -type d \
                -exec test -f '{}/config.yaml' ';' \
                -exec test -f '{}/Dockerfile' ';' \
                -print |
              sed 's#^apps/##' |
              sort |
              jq -R . |
              jq -sc .
            )
          fi
          CHANGED_APPS=$(jq -cn --argjson apps "${CHANGED_APPS:-[]}" --argjson failed "${FAILED_APPS:-[]}" '$apps - $failed')
          echo "build_apps=${CHANGED_APPS}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Apps scheduled for this run: ${CHANGED_APPS}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.app }}
    needs: update
    if: needs.update.outputs.build_apps != '' && needs.update.outputs.build_apps != '[]'
    permissions:
      actions: write
      contents: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.update.outputs.build_apps) }}
    uses: ./.github/workflows/hasos-app-builder.yaml
    with:
      app: apps/${{ matrix.app }}
      publish: true
      checkout_ref: ${{ needs.update.outputs.checkout_ref }}
      defer_image_size_commit: true
    secrets: inherit

  report-update-errors:
    name: Report failed app queries
    needs: [update, build]
    if: always() && needs.update.result == 'success' && needs.update.outputs.failed_apps != '' && needs.update.outputs.failed_apps != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mark partial update failure
        env:
          FAILED_APPS: ${{ needs.update.outputs.failed_apps }}
        run: |
          echo "::error::Update queries failed for: ${FAILED_APPS}. See the update job summary. Successful apps were processed separately."
          exit 1

  image-sizes:
    name: Commit image sizes
    needs: [update, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out latest branch state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download image size results
        uses: actions/download-artifact@v8
        with:
          pattern: image-size-*
          path: .image-size-results
          merge-multiple: true

      - name: Apply image sizes
        run: python .github/scripts/update_image_size.py --apply-results .image-size-results

      - name: Commit image sizes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- apps/*/.var.yaml; then
            echo "All image sizes are already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/*/.var.yaml
          git commit -m "chore: update app image sizes"

          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Unable to push the updated image sizes after three attempts."
            exit 1
          fi

          # Pushes made with GITHUB_TOKEN do not start another workflow.
          gh workflow run update_readme.yaml --ref "$GITHUB_REF_NAME"
