name: Auto-Translate Documentation

on:
#  push:
#    branches:
#      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "PyYAML==6.0.3" "requests==2.32.5" "deep-translator==1.11.4"

      - name: Translate all German files to English
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 .github/scripts/translate.py --auto-find --lang en

      - name: Commit and push translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No supported translation files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "docs: update English translations"
          git push
