name: Check Lint Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**/Dockerfile"
      - ".github/workflows/lint-docker.yaml"
      - ".github/.hadolint.yaml"
      - ".github/scripts/report_hadolint.py"

jobs:
  find:
    name: Find Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find all Dockerfiles
        id: find
        run: |
          dockerfiles=$(find . -type f -name 'Dockerfile' -not -path './.git/*' | jq -R -s -c 'split("\n")[:-1]')
          echo "dockerfiles=${dockerfiles}" >> $GITHUB_OUTPUT

  lint:
    name: Lint ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.find.outputs.dockerfiles) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run hadolint on ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .github/.hadolint.yaml
          failure-threshold: error
          format: json
          output-file: hadolint.json
          no-fail: true

      - name: Report lint severity correctly
        run: python3 .github/scripts/report_hadolint.py hadolint.json
