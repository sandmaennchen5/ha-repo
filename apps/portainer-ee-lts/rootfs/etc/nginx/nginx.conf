events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream portainer_backend { server 127.0.0.1:9000; }
  upstream ingress_sessions { server 127.0.0.1:1338; }
  server {
    listen 1337 default_server;
    client_max_body_size 0;
    gzip off;
    location = /__portainer_ingress_session {
      proxy_pass http://ingress_sessions/session;
      proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
      proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
    }
    location = /__portainer_ingress_auth {
      internal;
      proxy_pass http://ingress_sessions/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
      proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
      proxy_set_header X-Original-Authorization $http_authorization;
    }
    location / {
      auth_request /__portainer_ingress_auth;
      auth_request_set $portainer_authorization $upstream_http_x_portainer_authorization;
      auth_request_set $portainer_api_key $upstream_http_x_portainer_api_key;
      auth_request_set $portainer_cookie $upstream_http_x_portainer_cookie;
      proxy_pass http://portainer_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $http_host;
      # sub_filter cannot modify compressed HTML returned by Portainer.
      proxy_set_header Accept-Encoding "";
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Authentication is restored internally for the current HA user. Direct
      # API access keeps its original Authorization header via the auth helper.
      proxy_set_header Authorization $portainer_authorization;
      proxy_set_header X-API-Key $portainer_api_key;
      proxy_set_header Cookie "$http_cookie; $portainer_cookie";
      proxy_set_header X-Portainer-Ingress-JWT "";
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      # Portainer 2.44 stores browser authentication in an HttpOnly cookie
      # instead of returning a JWT body. Expose only this upstream cookie to
      # our same-origin ingress runtime so it can be retained per HA user.
      add_header X-Portainer-Ingress-Session $upstream_cookie_portainer_api_key always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors *; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * ws: wss:; img-src * data: blob:; style-src * 'unsafe-inline'; font-src * data:" always;
      sub_filter_once on;
      # Portainer uses <base href="/">, therefore a normal relative script URL
      # escapes the Home Assistant ingress prefix. Build it from the real path.
      sub_filter '</head>' '<script>(function(){var m=location.pathname.match(/^\/api\/hassio_ingress\/[^/]+\//),s=document.createElement("script");s.src=(m?m[0]:"/")+"__portainer_ingress_runtime.js";document.head.appendChild(s)})()</script></head>';
    }
    location = /__portainer_ingress_runtime.js {
      alias /usr/local/share/portainer-ingress-runtime.js;
      default_type application/javascript;
      add_header Cache-Control "no-store";
    }
  }
}
