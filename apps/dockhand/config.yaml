name: "Dockhand"
version: "1.0.44.1"
slug: "dockhand"
description: "Modern Docker and Compose management with Home Assistant Ingress."
stage: experimental
url: "https://dockhand.pro/manual/"
arch:
  - aarch64
  - amd64
image: "ghcr.io/sandmaennchen5/ha-repo-dockhand"
init: false
startup: services
docker_api: true
ingress: true
ingress_port: 3000
ingress_stream: true
panel_title: "Dockhand"
panel_icon: "mdi:docker"
ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Direct Web UI (optional assignment)"
environment:
  DATA_DIR: "/data"
  PUID: "0"
  PGID: "0"
options: {}
schema: {}
timeout: 120
