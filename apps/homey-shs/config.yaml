name: "Homey Self-Hosted Server"
version: "13.4.0"
slug: "homey-shs"
description: "Run Homey Self-Hosted Server on Home Assistant OS."
url: "https://support.homey.app/hc/en-us/categories/23974566220572"
arch:
  - aarch64
  - amd64
image: ghcr.io/sandmaennchen5/ha-repo-homey-shs
init: false
startup: services
host_network: true
full_access: true
ports:
  4859/tcp: null
  4860/tcp: null
  4861/tcp: null
  4862/tcp: null
ports_description:
  4859/tcp: "HTTP and Socket.IO"
  4860/tcp: "HTTPS"
  4861/tcp: "Homey Bridge v1"
  4862/tcp: "Homey Bridge v2"
webui: "http://[HOST]:[PORT:4859]"
panel_icon: "mdi:home-automation"
environment:
  PORT_SERVER_HTTP: "4859"
  PORT_SERVER_HTTPS: "4860"
  PORT_SERVER_BRIDGE_V1: "4861"
  PORT_SERVER_BRIDGE_V2: "4862"
