    name: Bias-T-Argumente
  DUMP1090_ADDITIONAL_ARGS:
    description: >-
      Optionale, durch Leerzeichen getrennte dump1090-Parameter, zum Beispiel
      --device 0, --device 00000001, --gain 40, --ppm 1 oder --freq
      1090000000. --device akzeptiert einen Geräteindex oder eine Seriennummer.
      Nur vom eingesetzten dump1090-Build unterstützte Parameter verwenden.
