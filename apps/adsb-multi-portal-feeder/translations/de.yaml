name: ADS-B Multi-Portal Feeder
description: >-
  Leitet ADS-B-Daten von einem RTL-SDR-Empfänger an FlightRadar24,
  FlightAware, ADSBexchange, PlaneFinder und weitere Portale weiter.
configuration:
  ADSBEXCHANGE_MLAT:
    description: MLAT-Beitrag aktivieren oder deaktivieren.
    name: ADSBexchange MLAT
  ADSBEXCHANGE_STATION_NAME:
    description: Stationsname für die MLAT-Karte.
    name: ADSBexchange-Stationsname
  ADSBEXCHANGE_UUID:
    description: Eindeutige UUID für den ADSBexchange-Feeder.
    name: ADSBexchange-UUID
  ADSBFI_MLAT:
    description: MLAT-Beitrag aktivieren oder deaktivieren.
    name: ADSB.fi MLAT
