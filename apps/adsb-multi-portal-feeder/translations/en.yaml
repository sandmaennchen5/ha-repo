name: ADS-B Multi-Portal Feeder
description: Forwards ADS-B data from an RTL-SDR receiver to FlightRadar24, FlightAware,
  ADSBexchange, PlaneFinder and other portals.
configuration:
  ADSBEXCHANGE_MLAT:
    description: Enable or disable MLAT contribution.
    name: ADSBexchange MLAT
  ADSBEXCHANGE_STATION_NAME:
    description: Station name for the MLAT map.
    name: ADSBexchange station name
  ADSBEXCHANGE_UUID:
    description: Unique UUID for the ADSBexchange feeder.
    name: ADSBexchange UUID
  ADSBFI_MLAT:
    description: Enable or disable MLAT contribution.
    name: ADSB.fi MLAT
  ADSBFI_STATION_NAME:
    description: Station name for the MLAT map.
    name: ADSB.fi – Station name
  ADSBFI_UUID:
    description: Unique UUID for the ADSB.fi feeder.
    name: ADSB.fi UUID
  ADSBHUB_CKEY:
    description: Release key for ADSBHub.
    name: ADSBHub share key
  BIAST_ARGS:
    description: Arguments for rtl_biast.
    name: Bias-T arguments
  DUMP1090_ADDITIONAL_ARGS:
    description: Optional space-separated dump1090 parameters, for example --device
      0, --device 00000001, --gain 40, --ppm 1, or --freq 1090000000. --device accepts
      a device index or serial number. Only use parameters supported by the dump1090
      build used.
    name: Additional dump1090 arguments
  DUMP1090_LOCAL_PORT:
    description: Connection for local devices.
    name: Local port 1090
  DUMP1090_REMOTE_HOST:
    description: Host of the remote Dump1090 server.
    name: Remote host for dump1090
  DUMP1090_REMOTE_PORT:
    description: Port of the remote Dump1090 server.
    name: Remote port for Dump1090
  FR24FEED_BS:
    description: Enable or disable BS mode.
    name: FR24 BS mode
  FR24FEED_FR24KEY:
    description: Your FlugRadar24 release key.
    name: FR24 key
  FR24FEED_HOST:
    description: FR24 data entry host.
    name: FR24 presenter
  FR24FEED_LOGMODE:
    description: Logging mode for FR24.
    name: FR24 protocol mode
  FR24FEED_LOGPATH:
    description: Path for FR24 protocols.
    name: Path to FR24 protocol
  FR24FEED_MLAT:
    description: Enable or disable MLAT for FR24.
    name: FR24 MLAT
  FR24FEED_MLAT_DASH_WITHOUT_DASH_GPS:
    description: Enable MLAT without GPS.
    name: FR24 MLAT without GPS
  FR24FEED_RAW:
    description: Enable or disable RAW mode.
    name: FR24 RAW mode
  FR24FEED_RECEIVER:
    description: Receiver type for FlightRadar24.
    name: FR24 receiver type
  HTML_DEFAULT_TRACKER:
    description: Default flight tracking website.
    name: Default tracker
  HTML_FR24_FEEDER_STATUS_PAGE:
    description: URL of the local FR24 status page for feeder flights.
    name: FR24 feed status page
  HTML_RECEIVER_STATS_PAGE_ADSBEXCHANGE:
    description: URL of your ADSBexchange statistics page.
    name: ADSBexchange statistics URL
  HTML_RECEIVER_STATS_PAGE_ADSBFI:
    description: URL of your ADSB.fi statistics page.
    name: ADSB.fi URL
  HTML_RECEIVER_STATS_PAGE_ADSBHUB:
    description: URL of your ADSBHub statistics page.
    name: ADSBHub statistics URL
  HTML_RECEIVER_STATS_PAGE_FLIGHTAWARE:
    description: URL of your FlightAware statistics page.
    name: URL to FlightAware statistics
  HTML_RECEIVER_STATS_PAGE_FLIGHTRADAR24:
    description: URL of your FR24 statistics page.
    name: URL of FlightRadar24 statistics
  HTML_RECEIVER_STATS_PAGE_OPENSKY_NETWORK:
    description: URL of your Opensky statistics page.
    name: Show Opensky URL
  HTML_RECEIVER_STATS_PAGE_PLANEFINDER:
    description: URL of your PlaneFinder statistics page.
    name: PlaneFinder statistics URL
  HTML_RECEIVER_STATS_PAGE_RADARBOX:
    description: URL of your Radarbox statistics page.
    name: Radarbox statistics URL
  HTML_SITE_ALT:
    description: Height of your recipient.
    name: Location at altitude
  HTML_SITE_LAT:
    description: Latitude of your receiver.
    name: Latitude
  HTML_SITE_LON:
    description: Longitude of your receiver.
    name: Longitude
  HTML_SITE_NAME:
    description: Name of your receiving page.
    name: Website name
  LAYERS_OWM_API_KEY:
    description: API key for OWM weather layers.
    name: OpenWeatherMap API key
  MLAT_ALTITUDE_MSL_METERS:
    description: Height above mean sea level in meters.
    name: MLAT height (MSL)
  MLAT_EXACT_LAT:
    description: Exact width for MLAT.
    name: MLAT latitude
  MLAT_EXACT_LON:
    description: Accurate longitude for MLAT.
    name: Longitude of MLAT
  OPENSKY_DEVICE_TYPE:
    description: Device type for Opensky.
    name: Opensky device type
  OPENSKY_INPUT_HOST:
    description: Host for Opensky submissions.
    name: Open host input
  OPENSKY_INPUT_PORT:
    description: Connection for Opensky input.
    name: Open the input port
  OPENSKY_SERIAL:
    description: Serial number generated by Opensky.
    name: “Open Sky” series
  OPENSKY_USERNAME:
    description: Your Opensky username.
    name: Opensky username
  PANORAMA_ALTS:
    description: Comma separated list of elevations.
    name: Height overview
  PANORAMA_ID:
    description: Hey, what's the Panorama ID?
    name: Panorama ID
  PIAWARE_FEEDER_DASH_ID:
    description: Your FlightAware feeder ID.
    name: FlightAware feeder ID
  PIAWARE_RECEIVER_DASH_HOST:
    description: Host address for the PiAware receiver.
    name: Recipient host
  PIAWARE_RECEIVER_DASH_PORT:
    description: Port for the PiAware receiver.
    name: Receiver connection
  PIAWARE_RECEIVER_DASH_TYPE:
    description: Receiver type for PiAware.
    name: Receiver type
  PLANEFINDER_INPUT_HOST:
    description: Host for PlaneFinder inputs.
    name: PlaneFinder input field
  PLANEFINDER_INPUT_PORT:
    description: Interface for PlaneFinder input.
    name: PlaneFinder input connector
  PLANEFINDER_SHARECODE:
    description: Your PlaneFinder unlock code.
    name: PlaneFinder unlock code
  RADARBOX_INPUT_HOST:
    description: Host for the radar box input.
    name: Radarbox input host
  RADARBOX_INPUT_PORT:
    description: Connection for the radar box input.
    name: Radar box input connection
  RADARBOX_MLAT:
    description: Enable or disable MLAT.
    name: Radar box MLAT
  RADARBOX_SHARING_KEY:
    description: Your Radarbox unlock key.
    name: Radarbox release key
  RTL_TCP_OVER_NETCAT:
    description: Enable rtl_tcp data transmission via netcat.
    name: RTL_TCP via netcat
  RTL_TCP_REMOTE_HOST:
    description: Host of the rtl_tcp server.
    name: RTL_TCP remote host
  RTL_TCP_REMOTE_PORT:
    description: Port of the rtl_tcp server.
    name: RTL_TCP remote port
  SERVICE_ENABLE_ADSBEXCHANGE:
    description: Enable or disable ADSBexchange feeders.
    name: Activate ADSBexchange
  SERVICE_ENABLE_ADSBFI:
    description: Enable or disable ADSB.fi feeder.
    name: Activate ADSB.fi
  SERVICE_ENABLE_ADSBHUB:
    description: Enable or disable ADSBHub feeder.
    name: Enable ADSBHub
  SERVICE_ENABLE_BIAST:
    description: Enable bias tee power supply for RTL-SDR devices.
    name: Activate Bias T
  SERVICE_ENABLE_DUMP1090:
    description: Enable or disable the “dump1090” service.
    name: Activate dump1090
  SERVICE_ENABLE_FR24FEED:
    description: Enable or disable the FlightRadar24 feed.
    name: Activate FR24 feeder
  SERVICE_ENABLE_HTTP:
    description: Enable or disable the dump1090 web interface.
    name: Enable HTTP server
  SERVICE_ENABLE_IMPORT_OVER_NETCAT:
    description: Import beast data from a remote dump1090 instance.
    name: Enable Netcat import
  SERVICE_ENABLE_OPENSKY:
    description: Activate or deactivate Opensky feeder.
    name: Activate OpenSky
  SERVICE_ENABLE_PIAWARE:
    description: Activate or deactivate the PiAware service.
    name: Activate PiAware
  SERVICE_ENABLE_PLANEFINDER:
    description: Enable or disable PlaneFinder feeders.
    name: Activate PlaneFinder
  SERVICE_ENABLE_RADARBOX:
    description: Enable or disable radar box feeder.
    name: Activate radar box
  SYSTEM_FR24FEED_ULIMIT_N:
    description: Maximum number of open files for the FR24 feeder.
    name: FR24 file limit
  SYSTEM_HTTP_ULIMIT_N:
    description: Maximum number of open files for the HTTP service to avoid OOM issues.
    name: HTTP file limit
