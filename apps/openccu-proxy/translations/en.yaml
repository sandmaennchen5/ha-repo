configuration:
  webui-url:
    name: OpenCCU WebUI URL (required)
    description: URL at which the external OpenCCU WebUI is accessible (e.g. `http://192.168.2.43/`)
  remember_ingress_users:
    name: Remember Ingress session
  remember_ingress_credentials:
    name: Store encrypted credentials
  ingress_keepalive_interval:
    name: Session keep-alive interval (seconds)
