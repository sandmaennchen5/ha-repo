name: "Portainer Agent (Channel Selector)"
version: "2026.8.2"
slug: "portainer-agent"
description: "Portainer Agent with selectable LTS/STS channel."
stage: experimental
url: "https://docs.portainer.io/admin/environments/add/docker/agent"
arch: [aarch64, amd64]
image: ghcr.io/sandmaennchen5/ha-repo-portainer-agent
init: false
startup: services
docker_api: true
ports:
  9001/tcp: 9001
ports_description:
  9001/tcp: "Portainer Agent API (HTTPS)"
panel_icon: "mdi:docker"
options:
  release_channel: lts
  agent_secret: ""
  log_level: INFO
  cluster_address: ""
  advertise_address: ""
  probe_interval: ""
  probe_timeout: ""
  environment: []
schema:
  release_channel: list(lts|sts)
  agent_secret: password?
  log_level: list(DEBUG|INFO|WARN|ERROR)
  cluster_address: str?
  advertise_address: str?
  probe_interval: str?
  probe_timeout: str?
  environment:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: password
