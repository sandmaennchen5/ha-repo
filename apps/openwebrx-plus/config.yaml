name: OpenWebRX+ ZVEI
version: "1.2.117.2"
slug: openwebrx-plus
description: Browser SDR with multimon-ng ZVEI and a dedicated RTL-SDR
url: https://github.com/sandmaennchen5/ha-repo
arch:
  - aarch64
stage: experimental
startup: application
boot: manual
init: false
usb: true
webui: http://[HOST]:[PORT:8073]/
ports:
  8073/tcp: 8073
ports_description:
  8073/tcp: OpenWebRX+ web interface
options:
  rtl_serial: ""
  initial_frequency: 145500000
  sample_rate: 1024000
  rf_gain: 29
  ppm: 0
  admin_password: ""
  monitor_enabled: true
  monitor_frequency: 0
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_topic: openwebrx/zvei
  rds_logging: true
  rds_mqtt_topic: openwebrx/rds
schema:
  rtl_serial: str
  initial_frequency: int(24000000,1766000000)
  sample_rate: int(250000,2400000)
  rf_gain: int(0,50)
  ppm: int(-200,200)
  admin_password: password
  monitor_enabled: bool
  monitor_frequency: int(0,1766000000)
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_tls: bool
  mqtt_topic: str
  rds_logging: bool
  rds_mqtt_topic: str
