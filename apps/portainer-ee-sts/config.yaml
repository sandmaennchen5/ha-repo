name: "Portainer EE STS"
version: "2.44.0.1"
slug: "portainer-ee-sts"
description: "Portainer CE/BE with selectable LTS/STS channel, ingress and data migration."
stage: stable
url: "https://docs.portainer.io/"
arch: [aarch64, amd64]
image: ghcr.io/sandmaennchen5/ha-repo-portainer-ee-sts
init: false
startup: services
boot: auto
docker_api: true
protected: false
apparmor: true
ingress: true
ingress_port: 1337
ingress_stream: true
panel_admin: true
panel_title: "Portainer"
panel_icon: "mdi:docker"
watchdog: "http://[HOST]:[PORT:9000]/api/system/status"
ports:
  8000/tcp: 8000
  9000/tcp: 9000
  9443/tcp: 9443
ports_description:
  8000/tcp: "Edge Agent tunnel"
  9000/tcp: "Direct HTTP Web UI (optional assignment)"
  9443/tcp: "Direct HTTPS Web UI (optional assignment)"
options:
  storage_location: data
  share_storage_directory: portainer-config
  remember_ingress_users: false
  agent_secret: ""
  advanced:
    admin_password: ""
    compact_database: false
    edge_compute: false
    log_level: INFO
    log_mode: PRETTY
    snapshot_interval: 5m
    templates_url: ""
    logo_url: ""
    hide_labels: []
    trusted_origins: ""
    tunnel_address: 0.0.0.0
    tunnel_port: 8000
    disable_content_security_policy: false
    license_key: ""
    environment: []
  import_export:
    export_on_stop: false
    export_directory: portainer-backups
    export_filename: "portainer-{version}-{timestamp}.tar.gz"
    import_mode: none
    import_search_directory: portainer-backups
    import_source: ""
    overwrite_existing_data: false
    allow_version_downgrade: false
    delete_after_import: false
schema:
  storage_location: list(data|config|share)
  share_storage_directory: str
  remember_ingress_users: bool
  agent_secret: password?
  advanced:
    admin_password: password?
    compact_database: bool
    edge_compute: bool
    log_level: list(DEBUG|INFO|WARN|ERROR)
    log_mode: list(PRETTY|NOCOLOR|JSON)
    snapshot_interval: str
    templates_url: str?
    logo_url: str?
    hide_labels:
      - str
    trusted_origins: str?
    tunnel_address: str
    tunnel_port: int(1,65535)
    disable_content_security_policy: bool
    license_key: password?
    environment:
      - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
        value: password
  import_export:
    export_on_stop: bool
    export_directory: str
    export_filename: str
    import_mode: list(none|auto|manual)
    import_search_directory: str
    import_source: str
    overwrite_existing_data: bool
    allow_version_downgrade: bool
    delete_after_import: bool
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
timeout: 120


